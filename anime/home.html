<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Home</title>

    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>


     <nav class="navbar bg-dark  p-4 border-body" data-bs-theme="dark">

        <a class="navbar-brand fw-bold" href="index.html">
            animeSearch
        </a>

        <div class="ms-auto d-flex gap-4">

            <a href="home.html" class="nav-link text-white">Home</a>

            <a href="main page.html" class="nav-link text-white">Main</a>

            <a href="character.html" class="nav-link text-white">Characters</a>

        </div>

    </nav>


    <div class="hero" id="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <h1 style="color: white;">One Piece Movies</h1>
            <p style="color: white;">Watch legendary One Piece films</p>
        </div>
    </div>


    <div class="container mt-4">
        <h3 class="mb-3">Movies</h3>

        <div class="row" id="movieContainer"></div>
    </div>

    <script>


        const setHeroBackground = () => {
            document.getElementById("hero").style.backgroundImage =
                "url(https://images5.alphacoders.com/606/thumb-1920-606284.jpg)";
        };

        setHeroBackground();



        const loadOnePieceMovies = () => {

            fetch("https://api.jikan.moe/v4/anime?q=One%20Piece%20Film&sfw")
                .then(response => response.json())
                .then(apiData => {

                    let outputHtml = "";

                    apiData.data.forEach(movie => {

                        outputHtml += `
                    <div class="col-md-3 mb-4">
                        <div class="card h-100 shadow"
                             onclick="alert('${movie.title}')">

                            <img src="${movie.images.jpg.image_url}" 
                                 class="card-img-top">

                            <div class="card-body text-center">
                                <h6>${movie.title}</h6>
                            </div>

                        </div>
                    </div>
                `;
                    });

                    document.getElementById("movieContainer").innerHTML = outputHtml;
                })
                .catch(error => {
                    console.log(error);
                    document.getElementById("movieContainer").innerHTML =
                        "<p>Failed to load movies</p>";
                });
        };

        loadOnePieceMovies();

    </script>

</body>

</html>
