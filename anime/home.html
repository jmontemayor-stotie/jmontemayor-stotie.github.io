<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Piece Home</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d0d0d;
    color: white;
}

/* NAVBAR */
.navbar {
    background: rgba(0,0,0,0.7);
}

/* HERO */
.hero {
    height: 60vh;
    background-size: cover;
    background-position: center;
    position: relative;
}

.hero-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
}

.hero-content {
    position: absolute;
    bottom: 20px;
    left: 40px;
}

/* SECTION TITLE */
.section-title {
    margin: 30px 0 10px;
    font-weight: bold;
}

/* CARD STYLE */
.card {
    background: #1a1a1a;
    color: white;
    border: none;
    overflow: hidden;
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.03);
}

/* IMAGE FIX */
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark px-3 d-flex align-items-center">

    <!-- LOGO -->
    <a class="navbar-brand fw-bold" href="index.html">
        animeSearch
    </a>

    <!-- MENU (RIGHT SIDE) -->
    <div class="ms-auto d-flex gap-4">

        <a href="home.html" class="nav-link text-white">Home</a>

        <a href="index.html" class="nav-link text-white">Main</a>

        <a href="anime_character.html" class="nav-link text-white">Characters</a>

    </div>

</nav>

<!-- HERO -->
<div class="hero" id="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1>One Piece Saga</h1>
        <p>Explore the journey of Luffy and the Straw Hat Pirates</p>
    </div>
</div>

<!-- SAGAS -->
<div class="container mt-4">

    <h3 class="section-title">One Piece Sagas</h3>
    <div class="row" id="sagaContainer"></div>

    <h3 class="section-title mt-5">One Piece Movies</h3>
    <div class="row" id="movieContainer"></div>

</div>

<script>

// HERO IMAGE
document.getElementById("hero").style.backgroundImage =
"url(https://images5.alphacoders.com/606/thumb-1920-606284.jpg)";


// =======================
// SAGAS API
// =======================
fetch("https://api.api-onepiece.com/v2/sagas/en")
.then(res => res.json())
.then(data => {

    let output = "";

    data.forEach(saga => {

        output += `
        <div class="col-md-3 mb-4">
            <div class="card h-100 p-3">

                <h6>${saga.title}</h6>
                <p style="font-size:12px;">
                    ${saga.description ? saga.description.substring(0, 80) + "..." : "No description"}
                </p>

            </div>
        </div>
        `;
    });

    document.getElementById("sagaContainer").innerHTML = output;
});


// =======================
// MOVIE THUMBNAILS (IMPROVED)
// =======================
const movies = [
    {
        title: "One Piece Film: Red",
        img: "https://m.media-amazon.com/images/I/81W6L7Y9XkL.jpg"
    },
    {
        title: "One Piece Stampede",
        img: "https://m.media-amazon.com/images/I/81Q3b1m1ZlL.jpg"
    },
    {
        title: "One Piece Film: Z",
        img: "https://m.media-amazon.com/images/I/71p5sQ7hZBL.jpg"
    },
    {
        title: "One Piece Film: Gold",
        img: "https://m.media-amazon.com/images/I/81kYk9v7hSL.jpg"
    }
];

let movieOutput = "";

movies.forEach(movie => {

    movieOutput += `
    <div class="col-md-3 mb-4">
        <div class="card h-100">

            <img src="${movie.img}" alt="${movie.title}">

            <div class="card-body text-center">
                <h6>${movie.title}</h6>
            </div>

        </div>
    </div>
    `;
});

document.getElementById("movieContainer").innerHTML = movieOutput;

</script>

</body>
</html>
