<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Home</title>

    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body id="body" data-bs-theme="light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-4">

        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <div class="h3">animeSearch</div>
        </div>
        </a>


        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
            aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>


        <div class="collapse navbar-collapse" id="navbarMenu">

            <div class="ms-auto d-flex flex-column flex-lg-row gap-4">

                <a href="home.html" class="nav-link text-white">Home</a>

                <a href="mainPage.html" class="nav-link text-white">Main</a>

                <a href="character.html" class="nav-link text-white">Characters</a>

                <button id="modeBtn" onclick="switchTheme()" class="btn btn-secondary  btn-sm m-3">
                    Dark Mode
                </button>

            </div>


        </div>
        </div>
    </nav>



    <div class="hero" id="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div>
                <h1 style="color: white;">One Piece Movies</h1>
            </div>
            <div>
                <p style="color: white;">Watch legendary One Piece films</p>
            </div>
        </div>
    </div>
    </div>


    <div class="container mt-4">
        <h3 class="mb-3">Movies</h3>

        <div class="row" id="movieContainer"></div>
    </div>

    <script>


        const setHeroBackground = () => {
            document.getElementById("hero").style.backgroundImage =
                "url(https://images5.alphacoders.com/606/thumb-1920-606284.jpg)";
        };

        setHeroBackground();



        const loadOnePieceMovies = async () => {
            const movieContainer = document.getElementById("movieContainer");

            movieContainer.innerHTML = "<p>Loading movies...</p>";

            try {
                const response = await fetch(
                    "https://jikan.lucashdo.com/v1/anime?q=One%20Piece%20Film&type=movie"
                );

                const apiData = await response.json();

                if (!response.ok) {
                    throw new Error(
                        `API error: ${response.status} - ${JSON.stringify(apiData)}`
                    );
                }

                console.log("API response:", apiData);
                console.log("First movie data:", apiData.data?.[0]);

                const movies = Array.isArray(apiData.data)
                    ? apiData.data
                    : [];

                if (movies.length === 0) {
                    movieContainer.innerHTML = "<p>No movies found.</p>";
                    return;
                }

                movieContainer.innerHTML = movies.map(movie => {
                    const title = movie.title || "Untitled";
                    const imageUrl =
                        movie.images?.jpg?.large_image_url ||
                        movie.images?.jpg?.image_url ||
                        movie.images?.webp?.large_image_url ||
                        movie.images?.webp?.image_url ||
                        movie.poster ||
                        movie.image_url ||
                        "";

                    return `
                <div class="col-6 col-md-3 mb-4">
                    <div class="card h-100 shadow"
                         onclick="alert(${JSON.stringify(title)})">

                        ${imageUrl
                            ? `<img src="${imageUrl}"
                                        class="card-img-top"
                                        alt="${title}"
                                        loading="lazy">`
                            : `<div class="p-4">No image available</div>`
                        }

                        <div class="card-body text-center">
                            <h6>${title}</h6>
                        </div>
                    </div>
                </div>
            `;
                }).join("");

            } catch (error) {
                console.error("Movie API error:", error);
                movieContainer.innerHTML = `
            <p class="text-danger">
                Unable to load movies. Open the browser console to see the error.
            </p>
        `;
            }
        };


        loadOnePieceMovies();

        var body = document.getElementById("body");
        var modeBtn = document.getElementById("modeBtn");

        var mode = body.getAttribute("data-bs-theme") === "dark"
            ? "Dark"
            : "Light";

        modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

        function switchTheme() {
            if (mode === "Light") {
                mode = "Dark";
            } else {
                mode = "Light";
            }

            body.setAttribute("data-bs-theme", mode.toLowerCase());
            modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";
        }

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
