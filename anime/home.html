<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Home</title>

    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark px-4 py-3">

    <div class="container-fluid">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="#">
            animeSearch
        </a>

        <!-- Hamburger -->
        <div class="dropdown ms-auto">

            <button class="btn btn-dark border-0"
                    type="button"
                    data-bs-toggle="dropdown">

                ☰
            </button>

            <!-- Dropdown Menu -->
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">

                <li>
                    <a class="dropdown-item" href="home.html">
                        Home
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="mainPage.html">
                        Main
                    </a>
                </li>

                <li>
                    <a class="dropdown-item" href="character.html">
                        Characters
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>



    <div class="hero" id="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
            <div>
                <h1 style="color: white;">One Piece Movies</h1>
            </div>
            <div>
                <p style="color: white;">Watch legendary One Piece films</p>
            </div>
        </div>
    </div>


    <div class="container mt-4">
        <h3 class="mb-3">Movies</h3>

        <div class="row" id="movieContainer"></div>
    </div>

    <script>


        const setHeroBackground = () => {
            document.getElementById("hero").style.backgroundImage =
                "url(https://images5.alphacoders.com/606/thumb-1920-606284.jpg)";
        };

        setHeroBackground();



        const loadOnePieceMovies = () => {

            fetch("https://api.jikan.moe/v4/anime?q=One%20Piece%20Film&sfw")
                .then(response => response.json())
                .then(apiData => {

                    let outputHtml = "";

                    apiData.data.forEach(movie => {

                        outputHtml += `
                    <div class=" col-6 col-md-3 col-sm-3 mb-4">
                        <div class="card h-100 shadow"
                             onclick="alert('${movie.title}')">

                            <img src="${movie.images.jpg.image_url}" 
                                 class="card-img-top">

                            <div class="card-body text-center">
                               <div class = h6>${movie.title}</h6></div> 
                            </div>

                        </div>
                    </div>
                `;
                    });

                    document.getElementById("movieContainer").innerHTML = outputHtml;
                })
                .catch(error => {
                    console.log(error);
                    document.getElementById("movieContainer").innerHTML =
                        "<p>Failed to load movies</p>";
                });
        };

        loadOnePieceMovies();

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
