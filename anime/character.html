<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>


    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body id="body" data-bs-theme="light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <h3>animeSearch</h3>
            </a>


            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>


            <div class="collapse navbar-collapse" id="navbarMenu">

                <div class="ms-auto d-flex flex-column flex-lg-row gap-4">

                    <a href="home.html" class="nav-link text-white">Home</a>

                    <a href="mainPage.html" class="nav-link text-white">Main</a>

                    <a href="character.html" class="nav-link text-white">Characters</a>

                    <button id="modeBtn" onclick="switchTheme()" class="btn bt-secondary-dark btn-sm m-3">
                        Dark Mode
                    </button>

                </div>

            </div>
        </div>
    </nav>




    <div class="container mt-4 text-center">
        <h2>One Piece Characters</h2>
    </div>


    <div class="container mt-4">
        <div class="row" id="resultsContainer"></div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>

    <script>

        function loadCharacters(animeName) {

            const container = document.getElementById("resultsContainer");
            container.innerHTML = "";


            fetch(`https://api.jikan.moe/v4/anime?q=${animeName}&limit=1`)
                .then(res => res.json())
                .then(animeData => {

                    const anime = animeData.data[0];

                    if (!anime) {
                        container.innerHTML = "<p class='text-center'>Anime not found</p>";
                        return;
                    }


                    return fetch(`https://api.jikan.moe/v4/anime/${anime.mal_id}/characters`);
                })
                .then(res => res.json())
                .then(charData => {

                    let output = "";

                    charData.data.forEach(item => {

                        const character = item.character;

                        output += `
                    <div class="col-6 col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 shadow">

                            <img src="${character.images.jpg.image_url}" class="card-img-top" >

                            <div class="card-body text-center">
                                <div class= h6> ${character.name}</h6></div>
                            </div>

                        </div>
                    </div>
                `;
                    });

                    container.innerHTML = output;

                })
                .catch(err => {
                    console.log(err);
                    container.innerHTML = "<p class='text-center'>Failed to load characters</p>";
                });
        }


        const savedAnime = localStorage.getItem("animeName");

        if (savedAnime) {
            loadCharacters(savedAnime);
        } else {
            loadCharacters("One Piece");
        }

        var mode = "Light"
        var body = document.getElementById("body");
        var modeBtn = document.getElementById("modeBtn");

        var mode = body.setAttribute(data - bs - theme) === "Dark" ? "Dark" : "Light";
        modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

        function switchTheme() {
            if (mode == "Light") {
                mode = "Dark";
                modeBtn.innerHTML = "Light mode"
            } else {
                mode = "Light";
                modeBtn.innerHTML = "Dark mode"
            }
            body.setAttribute("data-bs-theme", mode.toLowerCase());

        }

    </script>
</body>

</html>
