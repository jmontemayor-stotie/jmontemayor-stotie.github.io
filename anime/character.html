<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>


    <link rel="stylesheet" href="style.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: rgb(241, 228, 228); margin: 0%; font-family: Arial, Helvetica, sans-serif;">


     <nav class="navbar bg-dark  p-4 border-body" data-bs-theme="dark">
        <a class="navbar-brand fw-bold" href="index.html">
            animeSearch
        </a>

        <div class="ms-auto d-flex gap-4">

            <a href="home.html" class="nav-link text-white">Home</a>

            <a href="main page.html" class="nav-link text-white">Main</a>

            <a href="character.html" class="nav-link text-white">Characters</a>

        </div>

    </nav>


    <div class="container mt-4 text-center">
        <h2>One Piece Characters</h2>
    </div>


    <div class="container mt-4">
        <div class="row" id="resultsContainer"></div>
    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script>

        fetch("https://api.jikan.moe/v4/anime/21/characters")
            .then(res => res.json())
            .then(data => {

                let outputHtml = "";

                data.data.forEach(item => {

                    const characterData = item.character;

                    outputHtml += `
                        <div class="col-md-3 mb-4">
                            <div class="card h-100 shadow">

                                <img src="${characterData.images.jpg.image_url}" 
                                     class="card-img-top">

                                <div class="card-body text-center">
                                    <h6 class="card-title">${characterData.name}</h6>
                                </div>

                            </div>
                        </div>
                    `;
                });

                document.getElementById("resultsContainer").innerHTML = outputHtml;
            })
            .catch(err => {
                console.log(err);
                document.getElementById("resultsContainer").innerHTML =
                    "<p class='text-center'>Failed to load characters</p>";
            });

    </script>

</body>

</html>
