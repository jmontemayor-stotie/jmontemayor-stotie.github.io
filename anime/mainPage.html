<body id="body" data-bs-theme="light">

      <div class="collapse navbar-collapse" id="navbarMenu">

        <div class="ms-auto d-flex flex-column flex-lg-row gap-4">

          <a href="home.html" class="nav-link text-white">Home</a>

          <a href="mainPage.html" class="nav-link text-white">Main</a>

            Dark Mode
          </button>
        </div>

      </div>
    </div>
  </nav>




  <div class="hero-section d-flex justify-content-center align-items-center">


    <div class="col-12 col-md-8 col-lg-6 col-sm-6">

      <div class="glass-card text-center p-4">

        <div class=h5 class=" text-white mb-3">animeSearch</h5>
        </div>

        <div class=" d-flex flex-column align-items-center  gap-3">

          <input id="searchInput" class="form-control  w-75 text-center" placeholder="searchAnime">

          <button class=" btn btn-light w-50" onclick="searchAnime()">
            search
          </button>


        </div>
      </div>
    </div>
  </div>

  <div class="container mt-4" id="defaultContainer">
    <div class="row" id="defaultAnime"></div>
  </div>

  <div class="container mt-4" id="resultsContainer" style="display: none;">
    <div class="row" id="results"></div>
  </div>





  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    async function loadDefaultAnime() {
      const res = await fetch("https://api.jikan.moe/v4/anime?q=one piece");
      const data = await res.json();

      let output = "";

      data.data.slice(0, 8).forEach(anime => {
        output += `
      <div class="col-6 col-md-3 col-lg-3 mb-4">
        <div class="card">
          <img src="${anime.images.jpg.image_url}" class="card-img-top">
          <div class="card-body text-center">
            <div class = h6>${anime.title}</div>
          </div>
        </div>
      </div>
    `;
      });

      document.getElementById("defaultAnime").innerHTML = output;
    }

    loadDefaultAnime();

    function searchAnime() {

      const query = document.getElementById("searchInput").value;

      if (!query) {
        alert("Type anime name");
        return;
      }


      document.getElementById("defaultContainer").style.display = "none";
      document.getElementById("resultsContainer").style.display = "block";

      const results = document.getElementById("results");

      results.innerHTML = "<p class='text-white'>Loading...</p>";

      fetch(`https://api.jikan.moe/v4/anime?q=${query}`)
        .then(res => res.json())
        .then(data => {

          let output = "";

          data.data.forEach(anime => {

            output += `
                    <div class=" col-6 col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 shadow">

                            <img src="${anime.images.jpg.image_url}" class="card-img-top">
                            <div class="card-body text-center">
                              <div class = h6 class="card-title">${anime.title}</h6></div>
                            </div>
                        </div>
                    </div>
                `;
          });

          results.innerHTML = output;
        })
        .catch(error => {
          console.log(error);
          results.innerHTML = "failed to load anime";
        });

    }

    function goToCharacters(animeName) {
      localStorage.setItem("animeName", animeName);
      window.location.href = "character.html";
    }

    var mode = "Light"
    var body = document.getElementById("body");
    var modeBtn = document.getElementById("modeBtn");

    var mode = body.setAttribute(data - bs - theme) === "Dark" ? "Dark" : "Light";
    modeBtn.innerText = mode === "Dark" ? "Light Mode" : "Dark Mode";

    function switchTheme() {
      if (mode == "Light") {
        mode = "Dark";
        modeBtn.innerHTML = "Light mode"
      } else {
        mode = "Light";
        modeBtn.innerHTML = "Dark mode"
      }
      body.setAttribute("data-bs-theme", mode.toLowerCase());


    }




  </script>
</body>

</html>
