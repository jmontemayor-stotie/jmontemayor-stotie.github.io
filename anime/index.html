<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animeSearch</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="margin:0; font-family: Arial;">

    <nav class="navbar navbar-dark bg-dark w-100" id="mainNavbar">
        <div class="container-fluid">
            <a class="navbar-brand">animeSearch</a>
        </div>
    </nav>


    <div class="container text-center mt-5" id="mainContainer">

        <h1 class="mb-4">Anime Search</h1>

        <input id="searchInput" class="form-control w-50 mx-auto text-center" placeholder="Search anime">

        <button class="btn btn-primary mt-3" onclick="searchAnime()">
            Search
        </button>

    </div>

    <!-- results -->
    <div class="container mt-4">
        <div class="row" id="resultsContainer"></div>
    </div>

    <script>
        function searchAnime() {

            const query = document.getElementById("searchInput").value;

            if (!query) {
                alert("Please type an anime name");
                return;
            }

            const resultsContainer = document.getElementById("resultsContainer");
            resultsContainer.innerHTML = "";

            fetch(`https://api.jikan.moe/v4/anime?q=${query}`)
                .then(res => res.json())
                .then(data => {

                    let output = "";

                    data.data.forEach(anime => {

                        output += `
                    <div class="col-md-3 mb-4">
                        <div class="card h-100 shadow">

                            <img src="${anime.images.jpg.image_url}" class="card-img-top">

                            <div class="card-body text-center">
                                <h6 class="card-title">${anime.title}</h6>
                            </div>

                        </div>
                    </div>
                `;
                    });

                    resultsContainer.innerHTML = output;
                })
                .catch(error => {
                    console.log(error);
                    resultsContainer.innerHTML = "failed to load anime";
                });
        }
    </script>

</body>

</html>
