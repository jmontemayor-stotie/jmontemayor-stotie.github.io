<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>one_piece_home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
   <nav class="navbar navbar-dark px-3 d-flex align-items-center">

    <!-- LOGO -->
    <a class="navbar-brand fw-bold" href="index.html">
        animeSearch
    </a>

    <!-- MENU (RIGHT SIDE) -->
    <div class="ms-auto d-flex gap-4">

        <a href="home.html" class="nav-link text-white">Home</a>

        <a href="index.html" class="nav-link text-white">Main</a>

        <a href="anime_character.html" class="nav-link text-white">Characters</a>

    </div>

</nav>

    <div class="container mt-4" id="main_container">

        <h2 class="text-center mb-4" id="page_title">one_piece_characters</h2>

        <div class="row" id="character_container"></div>

    </div>

    <script>
        async function load_one_piece_characters() {

        const character_container = document.getElementById("character_container");

        try {
        const response = await fetch("https://api.api-onepiece.com/v2/characters/en");
        const one_piece_data = await response.json();

        console.log(one_piece_data);  

        one_piece_data.forEach(character_item => {

        character_container.innerHTML += `
        <div class="col-md-3 mb-4">
            <div class="one_piece_box">

                <img src="${character_item.image}" class="one_piece_image"
                    onerror="this.src='https://via.placeholder.com/300x400'">
                <div class="one_piece_name">
                    ${character_item.name}
                </div>

            </div>
        </div>
        `;
        });

        } catch (error) {
        console.log("ERROR:", error);
        character_container.innerHTML = "failed to load data";
        }
        }

        load_one_piece_characters();
        </script>

</body>

</html>
