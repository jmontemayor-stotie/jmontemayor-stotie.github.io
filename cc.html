<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>anime_site</title>

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- your css -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">

    <!-- logo -->
    <a class="navbar-brand" href="#">anime_site</a>

    <!-- menu -->
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="#">home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">genre</a></li>
        <li class="nav-item"><a class="nav-link" href="#">anime</a></li>
      </ul>

      <!-- ✅ SEARCH ON RIGHT -->
      <input id="search_input" class="form-control w-25 me-2" placeholder="search anime">
      <button class="btn btn-primary" onclick="search_anime()">search</button>

    </div>
  </div>
</nav>

<!-- ✅ RESULTS IN THE MIDDLE -->
<div class="container mt-4">
  <div id="card_container" class="row justify-content-center"></div>
</div>

<script>
function search_anime() {
  const name = document.getElementById("search_input").value;

  fetch("https://api.jikan.moe/v4/anime?q=" + name)
    .then(res => res.json())
    .then(data => {

      let output = "";

      data.data.forEach(anime => {
        output += `
          <div class="col-md-3 mb-4">
            <div class="card h-100">
              <img src="${anime.images.jpg.image_url}" class="card-img-top">
              <div class="card-body">
                <h6 class="card-title">${anime.title}</h6>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById("card_container").innerHTML = output;
    });
}
</script>

</body>
</html>
