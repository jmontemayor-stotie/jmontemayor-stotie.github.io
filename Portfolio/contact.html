<!DOCTYPE html>
<html lang="en">

<head>

<body>

<header class="navbar">

        <img src="image/Logo.png" alt="Jodi Logo" style="height: 35px; width: auto; display: block;">
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Open navigation menu" aria-expanded="false" type="button">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav-links" id="mainNav">
        <a href="index.html">Home</a>

</header>

    <main>
        <section class="section">
            <div class="container">
                <p class="eyebrow">Let's Connect</p>
                <h1>Contact Me</h1>
                <p class="section-description">
                    Feel free to reach out if you would like to connect or learn more about my projects.
                </p>

                <article class="card">

    <!-- FOOTER SA PINAKA-BABA -->
    <footer class="footer">
        <p>&copy; All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuToggle = document.getElementById("menuToggle");
            const mainNav = document.getElementById("mainNav");

            if (menuToggle && mainNav) {
                menuToggle.addEventListener("click", function () {
                    const isOpen = mainNav.classList.toggle("open");
                    menuToggle.setAttribute("aria-expanded", String(isOpen));
                });

                mainNav.querySelectorAll("a").forEach(function (link) {
                    link.addEventListener("click", function () {
                        mainNav.classList.remove("open");
                        menuToggle.setAttribute("aria-expanded", "false");
                    });
                });
            }
        });
    </script>

</body>

</html>
